<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수특 모음집 답지</title>
<style>
:root{--bg:#fff;--fg:#111;--muted:#777;--line:#e4e4e4;--soft:#f5f5f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;text-align:center}
.wrap{max-width:720px;margin:0 auto;padding:48px 16px 96px}
h1{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);font-size:13px;margin:6px 0 24px}
form{display:flex;gap:8px;max-width:420px;margin:0 auto}
input{flex:1;min-width:0;font:inherit;font-size:22px;text-align:center;padding:12px;border:1.5px solid var(--fg);border-radius:0;background:var(--bg);color:var(--fg);outline:none}
button,a.btn{font:inherit;font-size:14px;padding:10px 16px;border:1px solid var(--fg);border-radius:0;background:var(--bg);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-block;line-height:1.4}
button:hover,a.btn:hover{background:var(--fg);color:var(--bg)}
button.primary{background:var(--fg);color:var(--bg);font-size:16px;padding:12px 22px}
.nav{display:flex;gap:8px;justify-content:center;margin:14px 0 0;flex-wrap:wrap}
.nav button{border-color:var(--line)}
.card{margin-top:40px;padding-top:32px;border-top:1px solid var(--fg)}
.pid{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.pid .mark{font-size:14px;font-weight:700;vertical-align:middle;margin-left:10px;border:1.5px solid var(--fg);padding:2px 8px;letter-spacing:0}
.typ{color:var(--muted);font-size:14px;margin-top:8px}
.ans{display:inline-block;margin:22px 0 6px;border:2px solid var(--fg);padding:8px 28px;font-size:24px;font-weight:700}
.ans .k{font-size:13px;font-weight:500;color:var(--muted);margin-right:10px;vertical-align:middle}
.src{font-size:14px;margin-top:14px;line-height:1.6}
.code{display:inline-block;margin-top:8px;font-size:15px;letter-spacing:.04em;border-bottom:1px dashed var(--fg);cursor:pointer}
.links{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.links .btn.main{background:var(--fg);color:var(--bg)}
.note{margin:22px auto 0;max-width:560px;border:1px dashed var(--fg);padding:10px 14px;font-size:14px;text-align:left}
.label{font-size:12px;letter-spacing:.2em;color:var(--muted);margin:36px 0 12px}
.label::before,.label::after{content:"";display:inline-block;width:28px;height:1px;background:var(--line);vertical-align:middle;margin:0 12px}
.sol{display:block;width:100%;max-width:560px;height:auto;margin:0 auto;border:1px solid var(--line)}
.wrong-btn{margin-top:16px;font-size:15px;padding:10px 22px}
.wrong-btn.on{background:var(--fg);color:var(--bg)}
.profile{font-size:13px;margin:10px 0 0}
.profile button{font-size:12px;padding:3px 10px;margin-left:6px;border-color:var(--line)}
.empty{color:var(--muted);padding:40px 0}
.list{text-align:left}
.list h2{font-size:16px;margin:30px 0 6px;padding-bottom:6px;border-bottom:2px solid var(--fg)}
.list h3{font-size:14px;font-weight:600;margin:16px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 10px;border-color:var(--line)}
.chip.wrong{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;font-size:13px;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.foot{margin-top:56px;color:var(--muted);font-size:12px;line-height:1.7}
html,body{overflow-x:hidden}
@media (max-width:480px){
  .wrap{padding:32px 14px 80px}
  input{font-size:20px;padding:10px}
  button.primary{padding:10px 16px}
  .nav{gap:6px}.nav button{font-size:13px;padding:8px 10px}
  .pid{font-size:38px}
  .links .btn{font-size:13px;padding:9px 12px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">수능특강 문제모음집 답지</h1>
  <div class="profile" id="profile"></div>
  <div class="sub">문제집 번호를 입력하세요</div>
  <form id="f">
    <input id="q" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" placeholder="번호" autofocus>
    <button class="primary" type="submit">찾기</button>
  </form>
  <div class="nav"><button id="prev">← 이전</button><button id="all">유형별 목록</button><button id="wrongs">틀린 문제</button><button id="next">다음 →</button></div>
  <div id="out"></div>
  <div class="foot">문제와 해설의 저작권은 EBS에 있습니다. 개인 학습용으로만 쓰세요.<br>강의 버튼은 EBS 푸리봇(문항코드 검색)으로 연결됩니다.</div>
</div>
<div class="toast" id="toast"></div>
<script src="data.js?v=1"></script>
<script>
const D = window.BOOK, DATA = D.items;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(3, '0');
const bot = code => 'https://aibot.ebs.co.kr/hsc?usd=&active=Y&path=%2F&in_str=' + code.replace(/-/g, '');
const ebsi = code => 'https://www.ebsi.co.kr/ebs/pot/pots/retrieveTotalSearchList.ebs?sApiFsearch=' + encodeURIComponent(code);
$('#title').textContent = D.title;
document.title = D.short || D.title;
let cur = -1;
const ls = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
let profile = ls.get('profile') || '';
const key = () => 'wrong:' + profile;
const loadW = () => { try { return new Set(JSON.parse(ls.get(key()) || '[]')); } catch { return new Set(); } };
let wrong = loadW();
const saveW = () => { ls.set(key(), JSON.stringify([...wrong])); updWrongBtn(); };
function profiles(){ try { return JSON.parse(ls.get('profiles') || '[]'); } catch { return []; } }
function setProfile(){
  const list = profiles();
  const name = (prompt(list.length ? `프로필 이름을 입력하세요\n(저장된 프로필: ${list.join(', ')})` : '프로필 이름을 입력하세요', profile) || '').trim();
  if (!name) return false;
  profile = name; ls.set('profile', name);
  if (!list.includes(name)) ls.set('profiles', JSON.stringify([...list, name]));
  wrong = loadW(); renderProfile(); updWrongBtn(); if (cur >= 0) show(cur, true);
  return true;
}
function renderProfile(){
  $('#profile').innerHTML = profile ? `프로필 <b>${esc(profile)}</b><button onclick="setProfile()">변경</button>` : `<button onclick="setProfile()">프로필 만들기</button>`;
}
function updWrongBtn(){ $('#wrongs').textContent = `틀린 문제 ${wrong.size}`; }
function toggleWrong(){ if (!profile && !setProfile()) return; const n = DATA[cur].n; wrong.has(n) ? wrong.delete(n) : wrong.add(n); saveW(); show(cur, true); }
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1400); }
function copyCode(c){ (navigator.clipboard ? navigator.clipboard.writeText(c) : Promise.reject()).then(() => toast('문항코드 복사됨: ' + c), () => toast(c)); }
function search(e){
  e && e.preventDefault();
  const n = parseInt($('#q').value, 10); if (!n) return;
  const i = DATA.findIndex(d => d.n === n);
  if (i >= 0) show(i);
  else $('#out').innerHTML = `<div class="card empty">${pad(n)}번을 찾지 못했어요 (1~${DATA.length})</div>`;
}
function show(i, keep){
  cur = i; const d = DATA[i];
  $('#q').value = d.n; history.replaceState(null, '', '#' + pad(d.n));
  $('#out').innerHTML = `<div class="card">
    <div class="pid">${pad(d.n)}${wrong.has(d.n) ? '<span class="mark">틀림</span>' : ''}</div>
    <div class="typ">${esc(d.L)} · ${esc(d.type)}</div>
    <div class="ans"><span class="k">정답</span>${esc(d.answer)}</div>
    <div><button class="wrong-btn ${wrong.has(d.n) ? 'on' : ''}" onclick="toggleWrong()">${wrong.has(d.n) ? '✓ 틀린 문제로 저장됨 (해제)' : '✗ 틀렸어요 · 저장'}</button></div>
    <div class="src">${esc(d.src1)}<br>${esc(d.src2)}${d.level ? ' · ' + esc(d.level) : ''}</div>
    <div class="code" onclick="copyCode('${d.code}')">문항코드 ${d.code}</div>
    <div class="links"><a class="btn main" href="${bot(d.code)}" target="_blank" rel="noopener">푸리봇 강의·해설 보기</a><a class="btn" href="${ebsi(d.code)}" target="_blank" rel="noopener">EBSi에서 검색</a></div>
    ${d.note ? `<div class="note"><b>범위 메모</b> · ${esc(d.note)}</div>` : ''}
    <div class="label">EBS 해설</div>
    <img class="sol" src="sol/${d.code}.jpg" alt="${pad(d.n)}번 해설" loading="lazy">
  </div>`;
  if (!keep) window.scrollTo({top:0});
}
function listAll(){
  let h = '', lastL = '', lastT = '';
  DATA.forEach((d, i) => {
    if (d.L !== lastL) { if (lastL) h += '</div>'; h += `<h2>${esc(d.L)}</h2>`; lastL = d.L; lastT = ''; }
    if (d.type !== lastT) { if (lastT) h += '</div>'; h += `<h3>${esc(d.type)}</h3><div class="chips">`; lastT = d.type; }
    h += `<button class="chip ${wrong.has(d.n) ? 'wrong' : ''}" onclick="show(${i})">${pad(d.n)}</button>`;
  });
  $('#out').innerHTML = `<div class="card list">${h}</div></div>`;
}
function listWrong(){
  const items = DATA.map((d,i)=>[d,i]).filter(([d]) => wrong.has(d.n));
  $('#out').innerHTML = `<div class="card"><div class="typ">${profile ? esc(profile) + '님의 ' : ''}틀린 문제 ${items.length}개</div>${items.length
    ? `<div class="chips" style="justify-content:center;margin-top:14px">${items.map(([d,i]) => `<button class="chip wrong" onclick="show(${i})">${pad(d.n)}</button>`).join('')}</div><div class="nav" style="margin-top:24px"><button onclick="if(confirm('틀린 문제 기록을 모두 지울까요?')){wrong.clear();saveW();listWrong();}">기록 모두 지우기</button></div>`
    : '<div class="empty">아직 체크한 문제가 없어요</div>'}</div>`;
}
$('#f').onsubmit = search;
$('#q').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, ''); });
$('#prev').onclick = () => show(Math.max(0, cur - 1));
$('#next').onclick = () => show(Math.min(DATA.length - 1, cur + 1));
$('#all').onclick = listAll;
$('#wrongs').onclick = listWrong;
updWrongBtn(); renderProfile();
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowLeft') $('#prev').click(); if (e.key === 'ArrowRight') $('#next').click(); });
if (location.hash) { $('#q').value = location.hash.slice(1).replace(/\D/g, ''); search(); }
</script>
</body>
</html>
